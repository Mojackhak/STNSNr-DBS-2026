name: LFP
channels:
  - conda-forge
dependencies:
  - python=3.12.8
  - pip=24.2

  # ---- core scientific stack ----
  - numpy=2.0.2
  - scipy=1.14.1
  - pandas=2.2.3
  - matplotlib=3.10.3
  - scikit-learn=1.6.0
  - statsmodels=0.14.4
  - joblib=1.4.2
  - tqdm=4.67.1
  - cloudpickle=3.1.1
  - pyyaml=6.0.2
  - h5py=3.12.1
  - toml=0.10.2
  - send2trash=1.8.3
  - nibabel=5.3.2
  - requests=2.32.3

  # ---- neuro / lfp ----
  - mne=1.9.0
  - mne-connectivity=0.7.0
  - autoreject=0.4.3

  # ---- optional (handy) ----
  - ipython=8.18.1
  - jupyterlab=4.3.4
  - pytest=8.3.2
  - pyside6=6.7.2

  # ---- spike / pac ----
  - tensorpac=0.6.5
  - spikeinterface=0.102.3

  - pip:
      # Spectral parameterization (specparam, formerly fooof)
      - specparam==2.0.0rc3
      - tqdm-joblib==0.0.4
      - nex==1.0.6
      # MATLAB Engine (requires local MATLAB install)
