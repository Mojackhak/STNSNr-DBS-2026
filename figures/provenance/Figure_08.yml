  notes: Schematic baseline, pre-FoG and onset comparison. STN high-beta burst occupation decreases at
    onset; delta periodic power rises at onset. SNr theta periodic power increases before FoG relative
    to baseline and decreases at onset relative to pre-FoG. Low-beta wPLI decreases before FoG relative
    to baseline. Shading represents epoch-level comparisons, not newly inferred timepoint significance.
