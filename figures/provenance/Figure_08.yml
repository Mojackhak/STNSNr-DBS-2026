  notes: 'Upper visual order is Sit versus Turn; effects remain Turn relative to Sit: STN high-beta periodic
    power decreases and gamma increases, SNr high-beta/alpha bursting decreases, and gamma wPLI increases.
    Lower visual order is Single versus Dual turning; effects remain Dual relative to Single: STN low-beta
    power decreases and gamma increases, SNr alpha bursting increases, and gamma synchrony decreases.
    Motor and cognitive demand arrows identify the comparisons, not a fitted monotonic law.'
