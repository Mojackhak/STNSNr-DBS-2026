  - ${MYLFP_PROJECT_ROOT}/manuscript/presubmit_v0.1/figure0930/Figure_01.yml
  notes: The configuration transition is illustrated from four-contact STN-DBS to eight-contact STN+SNr-DBS,
    followed by associated FoG decrease, Pain decrease, Gait improvement and QoL improvement. Contact
    counts describe the hardware illustration, not the number of simultaneously active contacts. Pain
    uses a von Frey probe; QoL uses a person with a smile symbol. The arrows summarize observed clinical
    associations and do not establish causal efficacy. No new numerical effect estimates are plotted.
