  - ${MYLFP_PROJECT_ROOT}/manuscript/presubmit_v0.1/figure0930/Figure_03.pdf
  - ${MYLFP_PROJECT_ROOT}/manuscript/presubmit_v0.1/figure0930/Figure_04.pdf
  - ${MYLFP_PROJECT_ROOT}/manuscript/presubmit_v0.1/figure0930/Figure_05.pdf
  - ${MYLFP_PROJECT_ROOT}/manuscript/presubmit_v0.1/figure0930/Figure_06.pdf
  - ${MYLFP_PROJECT_ROOT}/manuscript/presubmit_v0.1/figure0930/Figure_07.pdf
  notes: Anatomical STN-above-SNr arrangement with an eight-contact lead. The beta reservoir and band-specific
    faucets are a working metaphor for task-dependent spectral reconfiguration, not conserved energy transfer.
    Delta/theta is paired with medication and a von Frey probe; gamma is paired with walking and turning.
    The mechanical example refers to onset relative to baseline. SNr is labelled State-associated dynamics
    and coupling State-dependent coordination. The diagram does not establish output gating, a dynamic
    brake, or a directed functional hierarchy.
- panel_id: clinical_associations
  panel_label: Clinical associations
  svg_group_id: clinical-associations-panel
  image_source: ${MANUAL_ARTWORK_ROOT}/Figure8.svg
  data_source: null
