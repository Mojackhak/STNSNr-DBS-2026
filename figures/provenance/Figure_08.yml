  notes: Schematic gait-cycle timeline and total low-beta/theta power profiles for STN and SNr, with low-beta
    wPLI below. The five anchors are contralateral HS at 0%, ipsilateral TO at 18%, ipsilateral HS at
    50%, contralateral TO at 68%, and the next contralateral HS at 100%. Local power and coupling are
    expressed relative to their cycle means; shaded intervals summarize the approved source findings.
    Heel-strike icons show heel contact with the forefoot raised. No periodic-only power trace is added
    to this panel.
