    synchrony decreases. Curves are schematic and do not reproduce individual recordings or EMM values.
- panel_id: working_hypothesis
  panel_label: Working hypothesis
  svg_group_id: working-hypothesis-panel
  image_source: ${MANUAL_ARTWORK_ROOT}/Figure8.svg
  data_source: null
